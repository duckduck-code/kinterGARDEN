name: Supabase keepalive

# Supabase pauses free-tier projects after 7 days with no activity. This pings
# the database a few times a week so the project never goes to sleep over
# breaks (see docs/requirements.md, section 6).

on:
  schedule:
    - cron: '0 13 * * 1,4' # 13:00 UTC every Monday and Thursday
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/school_years?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
